<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เส้นทางสุขภาวะคลองบางหลวง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2E2A;
    --ink-soft:#3E5650;
    --canal-deep:#16403C;
    --canal-mid:#4C7A72;
    --canal-pale:#DCE8E4;
    --rice:#F4EEE0;
    --rice-dim:#ECE4D2;
    --wood:#8B5E34;
    --marigold:#E0A438;
    --herb:#7D9471;
    --clay:#B5533C;
    --line:#D8CFB9;
    --radius-l:22px;
    --radius-m:14px;
    --radius-s:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%; overflow:hidden;}
  body{
    font-family:'Sarabun',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 8%, rgba(76,122,114,0.16), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(224,164,56,0.13), transparent 45%),
      #EFE9DA;
    height:100vh; height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 12px;
  }
  h1,h2,h3{font-family:'Taviraj',serif; margin:0; color:var(--canal-deep); font-weight:600;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  ::-webkit-scrollbar{width:0;height:0;}

  /* ---------- phone shell ---------- */
  .phone{
    width:100%;
    max-width:412px;
    height:min(860px, calc(100vh - 40px));
    height:min(860px, calc(100dvh - 40px));
    background:var(--rice);
    border-radius:32px;
    box-shadow:0 30px 60px -20px rgba(22,64,60,0.35), 0 0 0 1px rgba(22,64,60,0.06);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px 10px;
    background:var(--canal-deep);
    color:var(--rice);
    flex-shrink:0;
  }
  .topbar .brand{display:flex; align-items:center; gap:10px;}
  .topbar .brand .mark{
    width:30px;height:30px;border-radius:50%;
    background:var(--marigold);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
  }
  .topbar .brand-text{line-height:1.15;}
  .topbar .brand-text .t1{font-family:'Taviraj',serif; font-size:15px; font-weight:600;}
  .topbar .brand-text .t2{font-size:10.5px; color:var(--canal-pale); opacity:.85;}
  .icon-btn{
    background:rgba(244,238,224,0.12);
    border:1px solid rgba(244,238,224,0.25);
    color:var(--rice);
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
  }

  main#view{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding-bottom:14px;
    -webkit-overflow-scrolling:touch;
  }

  /* ---------- bottom tab bar ---------- */
  .tabbar{
    display:flex;
    border-top:1px solid var(--line);
    background:var(--rice);
    flex-shrink:0;
  }
  .tabbar button{
    flex:1;
    background:none;border:none;
    padding:8px 2px 10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);
    font-size:10.5px;
  }
  .tabbar button .ic{font-size:17px;}
  .tabbar button.active{color:var(--canal-deep); font-weight:600;}
  .tabbar button.active .ic{transform:translateY(-1px);}

  /* ---------- generic building blocks ---------- */
  .section{padding:12px 18px 4px;}
  .eyebrow-free-title{font-size:20px; line-height:1.22;}
  .lede{font-size:12.5px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}

  .wave{
    height:18px;
    background:var(--canal-deep);
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 20' preserveAspectRatio='none'><path d='M0 10 Q 12.5 0 25 10 T 50 10 T 75 10 T 100 10 V20 H0 Z'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 20' preserveAspectRatio='none'><path d='M0 10 Q 12.5 0 25 10 T 50 10 T 75 10 T 100 10 V20 H0 Z'/></svg>");
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
  }

  .stat-row{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:11px 18px 4px;
  }
  .stat-chip{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    padding:8px 9px;
    min-width:0;
  }
  .stat-chip .v{font-family:'Taviraj',serif; font-size:15px; color:var(--canal-deep); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stat-chip .l{font-size:9.5px; color:var(--ink-soft); margin-top:2px; line-height:1.25;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:10px 16px; border-radius:var(--radius-s);
    border:none; font-size:13.5px; font-weight:600; margin-top:7px;
  }
  .btn-primary{background:var(--canal-deep); color:var(--rice);}
  .btn-marigold{background:var(--marigold); color:var(--canal-deep);}
  .btn-outline{background:transparent; color:var(--canal-deep); border:1.4px solid var(--canal-deep);}
  .btn-ghost{background:var(--canal-pale); color:var(--canal-deep);}
  .btn-sm{padding:9px 12px; font-size:12.5px; width:auto; margin-top:0;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-m);
    padding:14px 15px; margin:10px 18px;
  }

  .badge{
    display:inline-block; padding:3px 9px; border-radius:99px; font-size:10.5px; font-weight:600;
  }
  .badge-live{background:#E4EFE8; color:#2F6B4F;}
  .badge-cached{background:#F1EADB; color:var(--wood);}
  .badge-mock{background:#EFE4EF; color:#7A4E7A;}

  .divider{height:1px; background:var(--line); margin:10px 0;}

  /* route cards */
  .route-card{
    margin:12px 18px; border-radius:var(--radius-l); overflow:hidden;
    border:1px solid var(--line); background:#fff;
  }
  .route-card .band{
    padding:16px 16px 14px; color:#fff; position:relative; overflow:hidden; min-height:118px;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .route-card .band .scene{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .route-card .band .scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 25%, rgba(0,0,0,0.5) 100%);}
  .route-card .band .content{position:relative; z-index:2;}
  .route-card .band .icon{font-size:26px;}
  .route-card .band h3{color:#fff; font-size:17px; margin-top:4px;}
  .route-card .band .meta{font-size:11px; opacity:.92; margin-top:3px;}

  .hero-scene{
    position:relative; margin:10px 18px 0; border-radius:var(--radius-l); overflow:hidden; min-height:82px;
    display:flex; align-items:flex-end;
  }
  .hero-scene .scene{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .hero-scene .scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,0.48) 100%);}
  .hero-scene .content{position:relative; z-index:2; padding:11px 14px; color:#fff;}
  .hero-scene .content .t{font-family:'Taviraj',serif; font-size:14px; font-weight:600;}
  .hero-scene .content .s{font-size:10px; opacity:.9; margin-top:2px;}
  .route-card .body{padding:13px 16px 15px;}
  .route-stops{font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;}
  .tag{background:var(--rice-dim); color:var(--ink-soft); font-size:10.5px; padding:4px 8px; border-radius:7px;}

  /* status pill for booking */
  .status-pill{font-size:10.5px; font-weight:600; padding:4px 10px; border-radius:99px; white-space:nowrap;}
  .st-open{background:#E4EFE8; color:#2F6B4F;}
  .st-low{background:#FBEEDB; color:#A2701C;}
  .st-verylow{background:#FBE4DC; color:var(--clay);}
  .st-pending{background:#EFE9DA; color:var(--wood);}
  .st-full{background:#F0E1DC; color:#8C3A26;}
  .st-paused{background:#EAEAEA; color:#6B6B6B;}

  .list-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 15px; border:1px solid var(--line); border-radius:var(--radius-m);
    margin:9px 18px; background:#fff;
  }
  .list-row .name{font-size:13.5px; font-weight:600; color:var(--ink);}
  .list-row .sub{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  /* transport ladder */
  .ladder{margin:10px 18px; padding:14px 15px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-m);}
  .leg{display:flex; gap:10px; padding:8px 0;}
  .leg .ic{width:26px; text-align:center; font-size:15px;}
  .leg .txt{flex:1; font-size:12.5px;}
  .leg .txt .tt{font-weight:600;}
  .leg .txt .ss{color:var(--ink-soft); font-size:11px; margin-top:1px;}
  .leg-line{width:1px; background:var(--line); margin-left:13px; height:10px;}
  .total-row{display:flex; justify-content:space-between; padding-top:10px; margin-top:6px; border-top:1px dashed var(--line); font-size:12.5px;}
  .total-row b{color:var(--canal-deep); font-family:'Taviraj',serif; font-size:15px;}

  /* form */
  .field{margin:0 18px 11px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field select, .field input{
    width:100%; padding:11px 12px; border-radius:var(--radius-s); border:1px solid var(--line);
    font-family:inherit; font-size:13px; background:#fff; color:var(--ink);
  }
  .chip-select{display:flex; flex-wrap:wrap; gap:7px;}
  .chip-opt{
    padding:8px 12px; border-radius:99px; border:1px solid var(--line); font-size:12px; background:#fff; color:var(--ink-soft);
  }
  .chip-opt.sel{background:var(--canal-deep); color:var(--rice); border-color:var(--canal-deep);}

  .steps-dots{display:flex; gap:5px; padding:0 18px 4px;}
  .steps-dots span{height:4px; flex:1; border-radius:4px; background:var(--line);}
  .steps-dots span.done{background:var(--canal-deep);}

  /* AI output timeline */
  .tl-item{display:flex; gap:11px; margin:0 18px;}
  .tl-marker{display:flex; flex-direction:column; align-items:center;}
  .tl-dot{width:9px;height:9px;border-radius:50%; background:var(--canal-deep); margin-top:5px;}
  .tl-bar{width:1.4px; flex:1; background:var(--line); margin:2px 0;}
  .tl-body{padding:0 0 16px; flex:1;}
  .tl-time{font-size:11px; color:var(--wood); font-weight:600;}
  .tl-name{font-size:13.5px; font-weight:600; margin-top:1px;}
  .tl-note{font-size:11.5px; color:var(--ink-soft); margin-top:2px; line-height:1.5;}

  .alert-card{
    margin:12px 18px; background:#FBEEDB; border:1px solid #E8CE9C; border-radius:var(--radius-m); padding:13px 14px;
  }
  .alert-card .h{font-size:13px; font-weight:700; color:#8C5D14; display:flex; align-items:center; gap:7px;}
  .opt-row{display:flex; gap:8px; margin-top:11px;}
  .opt-btn{flex:1; text-align:left; padding:10px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:11px;}
  .opt-btn b{display:block; font-size:12.5px; margin-bottom:2px; color:var(--canal-deep);}
  .opt-btn.chosen{border-color:var(--canal-deep); background:var(--canal-pale);}

  /* dashboard grid */
  .metric-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:12px 18px 4px;}
  .metric{background:#fff; border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 13px;}
  .metric .v{font-family:'Taviraj',serif; font-size:19px; font-weight:600; color:var(--canal-deep);}
  .metric .l{font-size:10.5px; color:var(--ink-soft); margin-top:3px;}
  .bar-track{height:6px; background:var(--rice-dim); border-radius:6px; margin-top:8px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--canal-mid); border-radius:6px;}

  /* supply chain */
  .flow-step{
    margin:0 18px; display:flex; align-items:center; gap:10px; padding:11px 0;
  }
  .flow-step .n{
    width:28px; height:28px; border-radius:50%; background:var(--herb); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; font-weight:600;
  }
  .flow-step .t{font-size:12.5px; font-weight:600;}
  .flow-connector{width:1.4px; height:14px; background:var(--line); margin-left:32px;}
  .lot-table{margin:12px 18px; border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
  .lot-row{display:flex; justify-content:space-between; padding:9px 13px; font-size:11.5px; border-bottom:1px solid var(--line);}
  .lot-row:last-child{border-bottom:none;}
  .lot-row .k{color:var(--ink-soft);}
  .lot-row .val{font-weight:600;}

  /* revenue receipt */
  .receipt{margin:12px 18px; border:1px dashed var(--line); border-radius:var(--radius-m); padding:14px 15px; background:#fff;}
  .receipt-row{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0;}
  .receipt-row.total{border-top:1px solid var(--line); margin-top:6px; padding-top:9px; font-weight:700; font-size:14px; color:var(--canal-deep);}
  .alloc-row{display:flex; align-items:center; gap:8px; margin:9px 18px 0;}
  .alloc-row .dot{width:9px;height:9px;border-radius:50%; flex-shrink:0;}
  .alloc-row .lbl{font-size:11.5px; flex:1;}
  .alloc-row .pct{font-size:11.5px; font-weight:600; color:var(--ink-soft);}

  /* trip summary */
  .rate-row{margin:0 18px 15px;}
  .rate-row .q{font-size:12.5px; font-weight:600; margin-bottom:7px;}
  .stars{display:flex; gap:6px;}
  .star{font-size:22px; color:var(--line); cursor:pointer;}
  .star.on{color:var(--marigold);}

  /* drawer */
  .scrim{
    position:absolute; inset:0; background:rgba(22,32,29,0.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20;
  }
  .scrim.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:absolute; top:0; left:0; bottom:0; width:78%;
    background:var(--rice); z-index:21; transform:translateX(-105%); transition:transform .25s ease;
    box-shadow:12px 0 30px rgba(0,0,0,0.2); padding:20px 16px; overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer h3{font-size:14px; margin-bottom:12px; color:var(--canal-deep);}
  .drawer-item{
    display:block; width:100%; text-align:left; background:none; border:none; padding:12px 6px;
    border-bottom:1px solid var(--line); font-size:13px; color:var(--ink); display:flex; align-items:center; gap:10px;
  }
  .drawer-item .ic{font-size:16px;}

  .back-row{display:flex; align-items:center; gap:9px; padding:14px 18px 4px;}
  .back-row button{background:var(--canal-pale); border:none; width:30px;height:30px;border-radius:50%; color:var(--canal-deep); font-size:14px;}
  .back-row h2{font-size:16px;}

  .qr{
    width:110px; height:110px; margin:14px auto 4px; display:grid; grid-template-columns:repeat(8,1fr); gap:2px;
    padding:8px; background:#fff; border:1px solid var(--line); border-radius:10px;
  }
  .qr div{background:var(--canal-deep); border-radius:1px;}
  .qr div.off{background:transparent;}

  /* AI chat */
  .chat-wrap{display:flex; flex-direction:column; min-height:100%; margin-bottom:-14px;}
  .chat-messages{flex:1; padding:14px 18px 8px; display:flex; flex-direction:column; gap:10px;}
  .msg-row{display:flex;}
  .msg-row.user{justify-content:flex-end;}
  .msg-bubble{max-width:78%; padding:10px 13px; border-radius:16px; font-size:13px; line-height:1.55;}
  .msg-row.bot .msg-bubble{background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; color:var(--ink);}
  .msg-row.user .msg-bubble{background:var(--canal-deep); color:var(--rice); border-bottom-right-radius:4px;}
  .msg-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; margin-left:2px;}
  .msg-chip{padding:7px 12px; border-radius:99px; border:1px solid var(--canal-deep); color:var(--canal-deep); font-size:11.5px; background:#fff;}
  .typing-dots{display:flex; gap:4px; padding:4px 2px;}
  .typing-dots span{width:6px; height:6px; border-radius:50%; background:var(--ink-soft); opacity:.5; animation:typingBounce 1s infinite ease-in-out;}
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0); opacity:.4;} 30%{transform:translateY(-4px); opacity:1;}}
  .chat-input-bar{
    position:sticky; bottom:0; display:flex; gap:8px; padding:10px 18px calc(10px + env(safe-area-inset-bottom));
    background:var(--rice); border-top:1px solid var(--line);
  }
  .chat-input-bar input{
    flex:1; padding:10px 14px; border-radius:99px; border:1px solid var(--line);
    font-family:inherit; font-size:13px; background:#fff; color:var(--ink);
  }
  .chat-input-bar button{
    width:40px; height:40px; border-radius:50%; border:none; background:var(--canal-deep); color:#fff; font-size:15px; flex-shrink:0;
  }

  /* community stories */
  .story-card{margin:12px 18px; border:1px solid var(--line); border-radius:var(--radius-m); background:#fff; padding:14px 15px;}
  .story-card .sh{display:flex; align-items:center; gap:9px; margin-bottom:8px;}
  .story-card .sh .ic{font-size:20px;}
  .story-card .sh h3{font-size:14.5px;}
  .story-card p{font-size:12px; color:var(--ink-soft); line-height:1.7;}
  .story-card .contact{margin-top:9px; font-size:11.5px; font-weight:600; color:var(--wood);}
  .access-card{margin:12px 18px; border:1px solid var(--line); border-radius:var(--radius-m); background:#fff; padding:13px 14px; display:flex; gap:11px;}
  .access-card .ic{font-size:20px; flex-shrink:0;}
  .access-card .t{font-size:13px; font-weight:600; margin-bottom:3px;}
  .access-card p{font-size:11.5px; color:var(--ink-soft); line-height:1.6;}

  .hero-collage{
    position:relative; margin:12px 18px 0; border-radius:var(--radius-l); overflow:hidden;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:3px;
    min-height:210px; background:var(--canal-deep);
  }
  .hero-collage .panel{position:relative; overflow:hidden;}
  .hero-collage .panel svg{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .hero-collage .scrim{position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0.05) 0%, rgba(15,30,27,0.55) 100%);}
  .hero-collage .headline{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 20px;
  }
  .hero-collage .headline h1{color:#fff; font-size:30px; letter-spacing:.5px; text-shadow:0 3px 14px rgba(0,0,0,0.45); line-height:1.1;}
  .hero-collage .headline .pill{
    margin-top:10px; background:var(--marigold); color:var(--canal-deep); font-weight:700; font-size:11.5px;
    padding:6px 16px; border-radius:99px; box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }

  .empty-note{margin:14px 18px; font-size:12px; color:var(--ink-soft); text-align:center; padding:20px 10px; border:1px dashed var(--line); border-radius:var(--radius-m);}

  /* animated route map */
  .map-wrap{padding:10px 18px 4px;}
  .map-chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:10px;}
  .map-svg-box{
    background:linear-gradient(180deg, var(--canal-pale), #EFF6F3);
    border:1px solid var(--line); border-radius:var(--radius-l);
    padding:10px; position:relative; overflow:hidden;
  }
  .map-svg-box svg{width:100%; height:auto; display:block;}
  .map-legend .legend-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .map-legend .legend-row:last-child{border-bottom:none;}
  .map-legend .dot-num{
    width:22px; height:22px; border-radius:50%; background:var(--canal-deep); color:#fff;
    font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .map-legend .name{font-size:12.5px; font-weight:600;}

  /* drawer sections */
  .drawer-section{font-size:10.5px; text-transform:none; color:var(--wood); font-weight:700; padding:14px 6px 4px; letter-spacing:.2px;}
  .drawer-section:first-of-type{padding-top:2px;}

  /* questionnaire / forms */
  .field textarea{
    width:100%; padding:11px 12px; border-radius:var(--radius-s); border:1px solid var(--line);
    font-family:inherit; font-size:13px; background:#fff; color:var(--ink); resize:vertical; min-height:64px;
  }
  .field-note{font-size:11px; color:var(--ink-soft); margin-top:5px;}

  /* AI reasoning score table */
  .score-row{margin:0 18px 11px;}
  .score-row .head{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:5px;}
  .score-row .head b{color:var(--canal-deep); font-family:'Taviraj',serif; font-size:13px;}
  .explain-box{margin:10px 18px 4px; padding:12px 13px; background:var(--canal-pale); border-radius:var(--radius-m); font-size:12px; color:var(--ink-soft); line-height:1.6;}

  /* area status pill */
  .area-status{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:99px; font-size:11px; font-weight:600;}
  .area-normal{background:#E4EFE8; color:#2F6B4F;}
  .area-watch{background:#FBEEDB; color:#A2701C;}
  .area-alert{background:#F0E1DC; color:#8C3A26;}

  /* alt-place suggestions */
  .alt-item{display:flex; align-items:center; gap:11px; padding:12px 13px; border:1px solid var(--line); border-radius:var(--radius-m); margin:9px 18px; background:#fff;}
  .alt-item .n{width:26px; height:26px; border-radius:50%; background:var(--canal-pale); color:var(--canal-deep); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .alt-item .t{font-size:12.5px; font-weight:600; flex:1;}

  /* provider dashboard toggles */
  .toggle-row{display:flex; justify-content:space-between; align-items:center; padding:12px 15px; border:1px solid var(--line); border-radius:var(--radius-m); margin:9px 18px; background:#fff;}
  .toggle-row .name{font-size:12.5px; font-weight:600;}
  .toggle{width:42px; height:24px; border-radius:99px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0;}
  .toggle.on{background:var(--herb);}
  .toggle .knob{width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:left .15s;}
  .toggle.on .knob{left:21px;}
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:6px 18px 10px;}
  .action-grid button{padding:11px 8px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:11px; text-align:center; color:var(--ink);}

  /* food system */
  .food-card{margin:12px 18px; border:1px solid var(--line); border-radius:var(--radius-m); background:#fff; padding:14px 15px;}
  .food-card .shop-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .food-card .shop-head .sn{font-size:14px; font-weight:600; font-family:'Taviraj',serif; color:var(--canal-deep);}
  .food-card .shop-head .sm{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .food-item{padding:9px 0; border-top:1px dashed var(--line);}
  .food-item:first-child{border-top:none;}
  .food-item .row1{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600;}
  .food-tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px;}
  .food-actions{display:flex; gap:8px; margin-top:11px;}
  .food-actions button{flex:1;}

  @media (max-width:440px){
    body{padding:0;}
    .phone{border-radius:0; height:100vh; height:100dvh; max-width:100%;}
  }
</style>
</head>

  Object.entries(CHROME_LABELS).forEach(([id,[th,en]])=>{
    const node=document.getElementById(id);
    if(node) node.textContent = state.lang==='en' ? en : th;
  });
  const langBtn=document.getElementById('langBtn');
  if(langBtn) langBtn.textContent = state.lang==='en' ? 'EN' : 'TH';

  state.lang = state.lang==='th' ? 'en' : 'th';
  applyChrome();
  render();
}

function getMapsQuery(name){ return PLACE_QUERY[name] || (name+' คลองบางหลวง กรุงเทพ'); }
function openMaps(name){
  // opens turn-by-turn directions from the visitor's current location to this place
  const url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(getMapsQuery(name))+'&travelmode=walking';
  window.open(url, '_blank');
}
function openRouteDirections(stopNames, mode){
  const queries=stopNames.map(getMapsQuery);
  let url='https://www.google.com/maps/dir/?api=1';
  url+='&origin='+encodeURIComponent(queries[0]);
  url+='&destination='+encodeURIComponent(queries[queries.length-1]);
  if(queries.length>2){
    url+='&waypoints='+encodeURIComponent(queries.slice(1,-1).join('|'));
  }
  url+='&travelmode='+(mode||'walking');
  window.open(url, '_blank');
}
function openRouteById(id, mode){
  const route=ROUTES.find(r=>r.id===id);
  if(route) openRouteDirections(route.stops, mode);
}

function setTab(t){state.tab=t; state.extra=null; closeDrawer(); render();}

/* ---------------- render dispatcher ---------------- */
function render(){
  document.getElementById('drawer').classList.toggle('open', state.drawerOpen);
  document.getElementById('scrim').classList.toggle('open', state.drawerOpen);
  document.getElementById('tabbar').style.display = state.extra ? 'none' : 'flex';
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));

  const view=document.getElementById('view');
  view.innerHTML='';
  if(state.extra){
    view.appendChild(renderExtra(state.extra));
    return;
  }
  if(state.tab==='home') view.appendChild(renderHome());
  else if(state.tab==='routes') view.appendChild(renderRoutes());
  else if(state.tab==='transport') view.appendChild(renderTransport());
  else if(state.tab==='booking') view.appendChild(renderBooking());
  else if(state.tab==='assistant') view.appendChild(renderAssistant());
}

  'จุดเรียนรู้สมุนไพร':['ทัวร์สวนสมุนไพร','อบรมชงชาสมุนไพร']
};

function renderBookingWizard(){
  const b=state.booking;
  const steps=['สถานที่','กิจกรรม','วันเวลา','จำนวนคน','ผู้ติดต่อ','ราคา','ยืนยัน'];
  const wrap=el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="back-row"><button onclick="closeBooking()">←</button><h2>${L('จองคิว','Booking')} · ${b.spot}</h2></div>
  `));
  if(!b.confirmed){
    const dots=el(`<div class="steps-dots" style="margin:10px 0 14px;"></div>`);
    for(let i=0;i<steps.length;i++) dots.appendChild(el(`<span class="${i<=b.step?'done':''}"></span>`));
    wrap.appendChild(dots);
  }

  if(b.confirmed){
    const price = 150 + b.people*20;
    const vendor=findVendor(b.spot);
    let seed=0; for(const c of b.code) seed+=c.charCodeAt(0);
    const qr=el(`<div class="qr"></div>`);
    for(let i=0;i<64;i++){ const on=((seed*(i+7))%5)<2; qr.appendChild(el(`<div class="${on?'':'off'}"></div>`)); }
    wrap.appendChild(el(`
      <div class="section" style="text-align:center; padding-top:6px;">
        <div style="font-size:34px;">✅</div>
        <h2 style="font-size:17px; margin-top:6px;">${L('จองสำเร็จแล้ว','Booking confirmed')}</h2>
        <p class="lede">${L('เลขที่การจอง','Booking number')} <b style="color:var(--canal-deep);">${b.code}</b></p>
      </div>
    `));
    wrap.appendChild(qr);
    wrap.appendChild(el(`
      <div class="card" style="margin-top:16px;">
        <div class="lot-row"><span class="k">${L('สถานที่','Place')}</span><span class="val">${b.spot}</span></div>
        <div class="lot-row"><span class="k">${L('กิจกรรม','Activity')}</span><span class="val">${b.activity}</span></div>
        <div class="lot-row"><span class="k">${L('วันที่ / เวลา','Date / Time')}</span><span class="val">${b.date} · ${b.time}</span></div>
        <div class="lot-row"><span class="k">${L('จำนวนคน','People')}</span><span class="val">${b.people} ${L('คน','people')}</span></div>
        <div class="lot-row"><span class="k">${L('เลขอ้างอิง','Reference no.')}</span><span class="val">${b.code}</span></div>
        <div class="lot-row"><span class="k">${L('ยอดชำระ','Total')}</span><span class="val">${price} ${L('บาท','THB')}</span></div>
        <div class="lot-row"><span class="k">${L('ชำระผ่าน','Pay via')}</span><span class="val">${vendor?vendor.payType+(vendor.payDetail?' · '+vendor.payDetail:''):L('เงินสดหน้างาน','Cash on-site')}</span></div>
      </div>
    `));
    wrap.appendChild(el(`
      <div class="section">
        <button class="btn btn-outline" onclick="alert('${L('เพิ่มลงปฏิทินแล้ว (จำลอง)','Added to calendar (simulated)')}')">📅 ${L('เพิ่มลงปฏิทิน','Add to calendar')}</button>
        <button class="btn btn-outline" onclick="openMaps('${b.spot}')">🗺️ ${L('เปิด Google Maps','Open Google Maps')}</button>
      </div>
    `));
    wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" onclick="closeBooking()">${L('เสร็จสิ้น','Done')}</button></div>`));
    return wrap;
  }

  if(b.step===0){
    wrap.appendChild(el(`<div class="section" style="padding-top:0;"><p class="lede">${L('ยืนยันสถานที่ที่ต้องการจอง','Confirm the place you want to book')}</p></div>`));
    wrap.appendChild(el(`
      <div class="card">
        <div class="name" style="font-size:15px;">${b.spot}</div>
        <div class="sub" style="margin-top:4px;">${L('แตะ "ถัดไป" เพื่อเลือกกิจกรรม','Tap "Next" to choose an activity')}</div>
      </div>
    `));
    wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" onclick="bookingNext()">${L('ถัดไป','Next')}</button></div>`));
  } else if(b.step===1){
    const wrap2=el(`<div class="field" style="margin-top:8px;"><label>${L('เลือกกิจกรรม','Choose an activity')}</label><div class="chip-select"></div></div>`);
    const chipHolder=wrap2.querySelector('.chip-select');
    (ACTIVITIES_BY_SPOT[b.spot]||['กิจกรรมทั่วไป']).forEach(a=>{
      chipHolder.appendChild(el(`<div class="chip-opt ${b.activity===a?'sel':''}" onclick="setBookingField('activity','${a}')">${a}</div>`));
    });
    wrap.appendChild(wrap2);
    wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" ${b.activity?'':'style="opacity:.5;pointer-events:none;"'} onclick="bookingNext()">${L('ถัดไป','Next')}</button></div>`));
  } else if(b.step===2){
    wrap.appendChild(el(`
      <div class="field" style="margin-top:8px;"><label>${L('วันที่','Date')}</label>
        <input type="date" value="2026-02-14" onchange="setBookingField('date', this.value)"></div>
      <div class="field"><label>${L('เวลา','Time')}</label>
        <input type="time" value="10:00" onchange="setBookingField('time', this.value)"></div>
    `));
    wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" onclick="bookingNext()">${L('ถัดไป','Next')}</button></div>`));
  } else if(b.step===3){
    wrap.appendChild(el(`
      <div class="field" style="margin-top:8px;"><label>${L('จำนวนคน','Number of people')}</label>
        <div style="display:flex; align-items:center; gap:14px;">
          <button class="icon-btn" style="background:var(--canal-pale); color:var(--canal-deep);" onclick="adjustPeople(-1)">−</button>
          <div style="font-family:'Taviraj',serif; font-size:20px; font-weight:600;">${b.people}</div>
          <button class="icon-btn" style="background:var(--canal-pale); color:var(--canal-deep);" onclick="adjustPeople(1)">+</button>
        </div>
      </div>
    `));
    wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" onclick="bookingNext()">${L('ถัดไป','Next')}</button></div>`));
  } else if(b.step===4){
    wrap.appendChild(el(`
      <div class="field" style="margin-top:8px;"><label>${L('ชื่อผู้จอง','Booker name')}</label><input placeholder="${L('ชื่อ-นามสกุล','Full name')}" oninput="setBookingField('name', this.value)"></div>
      <div class="field"><label>${L('เบอร์โทรศัพท์','Phone number')}</label><input placeholder="08X-XXX-XXXX" oninput="setBookingField('phone', this.value)"></div>
    `));
    wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" onclick="bookingNext()">${L('ถัดไป','Next')}</button></div>`));
  } else if(b.step===5){
    const price = 150 + b.people*20;
    const vendor=findVendor(b.spot);
    wrap.appendChild(el(`
      <div class="card">
        <div class="lot-row"><span class="k">${L('ค่ากิจกรรม (ต่อคน)','Activity fee (per person)')}</span><span class="val">150 ${L('บาท','THB')}</span></div>
        <div class="lot-row"><span class="k">${L('ส่วนเพิ่มตามจำนวนคน','Extra for group size')}</span><span class="val">${b.people*20} ${L('บาท','THB')}</span></div>
        <div class="lot-row" style="border-top:1px solid var(--line); padding-top:9px;"><span class="k" style="font-weight:700; color:var(--ink);">${L('ยอดรวม','Total')}</span><span class="val" style="color:var(--canal-deep); font-size:14px;">${price} ${L('บาท','THB')}</span></div>
      </div>
    `));
    wrap.appendChild(el(`
      <div class="explain-box">
        💳 ${L('ชำระเงินโดยตรงกับ','Pay directly to')} <b>${vendor?vendor.name:b.spot}</b> ${L('ผ่าน','via')}${vendor?` ${vendor.payType}${vendor.payDetail?': '+vendor.payDetail:''}`:L('เงินสดหน้างาน','cash on-site')}<br>
        ${L('เว็บนี้เป็นเพียงตัวกลางด้านการจองคิวและข้อมูล ไม่ได้รับเงินหรือถือเงินแทนผู้ประกอบการ','This site only manages bookings and information — it never receives or holds payment on behalf of vendors')}
      </div>
    `));
    wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" onclick="bookingNext()">${L('ยืนยันการจอง','Confirm booking')}</button></div>`));
  }
  return wrap;
}
function setBookingField(k,v){ state.booking[k]=v; render(); }
function adjustPeople(d){ state.booking.people=Math.max(1, state.booking.people+d); render(); }
function bookingNext(){
  if(state.booking.step<5){ state.booking.step++; }
  else{
    state.booking.confirmed=true;
    state.booking.code='BLH-'+Math.floor(10000+Math.random()*89999);
  }
  render();
}

function setAiField(k,v){ state.ai[k]=v; render(); }
function adjustAiPeople(d){ state.ai.people=Math.max(1,state.ai.people+d); render(); }
function generatePlan(){ if(!state.selectedRoute) state.selectedRoute=ROUTES[0]; state.ai.step='output'; render(); }

function simulateReroute(){ state.ai.reroute=1; state.ai.chosen=null; render(); }
function chooseReroute(x){ state.ai.chosen=x; render(); }

  wrap.appendChild(el(`<div class="back-row"><button onclick="backFromExtra()">←</button><h2>แผนที่เส้นทางเคลื่อนไหว</h2></div>`));
  wrap.appendChild(el(`<div class="section" style="padding-top:4px;"><p class="lede">ภาพจำลองเส้นทางตามลำคลอง จุดสีทองคือตำแหน่งที่กำลังเคลื่อนที่ตามเวลาจริง แตะชื่อรูทเพื่อสลับดูเส้นทางอื่น</p></div>`));

  const chipRow=el(`<div class="map-wrap" style="padding-bottom:0;"><div class="map-chip-row"></div></div>`);
  const chipHolder=chipRow.querySelector('.map-chip-row');
  ROUTES.forEach(r=>{
    chipHolder.appendChild(el(`<div class="chip-opt ${r.id===route.id?'sel':''}" style="flex-shrink:0;" onclick="setMapRoute('${r.id}')">${r.icon} ${r.name}</div>`));
  });
  wrap.appendChild(chipRow);

  const n=route.stops.length;
  const idxScale=(i)=> n>1 ? Math.round(i*(WAYPOINTS.length-1)/(n-1)) : 0;

  let markers='', labels='';
  route.stops.forEach((s,i)=>{
    const wp=WAYPOINTS[idxScale(i)];
    markers+=`
      <circle cx="${wp.x}" cy="${wp.y}" r="9" fill="#fff" stroke="${route.color}" stroke-width="3"/>
      <text x="${wp.x}" y="${wp.y+3.5}" font-size="9" font-family="Sarabun" text-anchor="middle" fill="${route.color}" font-weight="700">${i+1}</text>
    `;
    const side = wp.x>110 ? -1 : 1;
    const lx = wp.x + side*14;
    const shortName = s.length>14 ? s.slice(0,13)+'…' : s;
    labels+=`<text x="${lx}" y="${wp.y-14}" font-size="9.5" font-family="Sarabun" font-weight="600" fill="var(--ink)" text-anchor="${side>0?'start':'end'}">${shortName}</text>`;
  });

  const svg=`
    <svg viewBox="0 0 220 500" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 Q60,50 120,60 T220,60" stroke="var(--canal-mid)" stroke-width="1" fill="none" opacity="0.18"/>
      <path d="M0,180 Q60,170 120,180 T220,180" stroke="var(--canal-mid)" stroke-width="1" fill="none" opacity="0.14"/>
      <path d="M0,320 Q60,310 120,320 T220,320" stroke="var(--canal-mid)" stroke-width="1" fill="none" opacity="0.14"/>
      <path d="${CANAL_PATH}" stroke="${route.color}" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.9"/>
      <path d="${CANAL_PATH}" stroke="#fff" stroke-width="1.6" fill="none" stroke-dasharray="1 9" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.1s" repeatCount="indefinite"/>
      </path>
      ${markers}
      ${labels}
      <circle r="6.5" fill="var(--marigold)" stroke="#fff" stroke-width="2">
        <animateMotion dur="7s" repeatCount="indefinite" path="${CANAL_PATH}"/>
      </circle>
    </svg>
  `;
  wrap.appendChild(el(`<div class="map-wrap"><div class="map-svg-box">${svg}</div></div>`));

  const legend=el(`<div class="map-wrap"><div class="map-legend"></div></div>`);
  const legendHolder=legend.querySelector('.map-legend');
  route.stops.forEach((s,i)=>{
    legendHolder.appendChild(el(`<div class="legend-row"><div class="dot-num" style="background:${route.color};">${i+1}</div><div class="name">${s}</div></div>`));
  });
  wrap.appendChild(legend);
  wrap.appendChild(el(`
    <div class="section">
      <button class="btn btn-primary" onclick="chooseRoute('${route.id}')">ใช้รูทนี้กับผู้ช่วย AI</button>
      <button class="btn btn-outline" onclick="openRouteById('${route.id}','walking')">🧭 เปิดเส้นทางเดินจริงใน Google Maps</button>
    </div>
  `));
  return wrap;
}

function getBotReply(msg){
  const m=msg.toLowerCase();
  for(const r of BOT_RULES){ if(r.kw.some(k=>m.includes(k))) return r; }
  return {reply:'ขอบคุณสำหรับข้อความค่ะ ลองบอกความสนใจ เช่น อยากเดินน้อย อยากกินอาหารสุขภาพ หรืออยากนั่งเรือ แล้วดิฉันจะแนะนำเส้นทางให้ได้เลยค่ะ', chips:[{l:'เริ่มทำแบบสอบถาม',a:"openExtra('questionnaire')"},{l:'ดูรูทแนะนำทั้งหมด',a:"setTab('routes')"}]};
}
function scrollChatToBottom(){
  requestAnimationFrame(()=>{ const v=document.getElementById('view'); if(v) v.scrollTop=v.scrollHeight; });
}
function chatKeydown(e){ if(e.key==='Enter'){ sendChatMessage(); } }
function sendChatMessage(){
  const inp=document.getElementById('chatInput');
  if(!inp) return;
  const text=inp.value.trim();
  if(!text) return;
  state.chat.messages.push({from:'user', text});
  state.chat.typing=true;
  render();
  scrollChatToBottom();
  setTimeout(()=>{
    const r=getBotReply(text);
    state.chat.typing=false;
    state.chat.messages.push({from:'bot', text:r.reply, chips:r.chips});
    render();
    scrollChatToBottom();
  }, 650+Math.random()*450);
}

function submitQuestionnaire(){
  const s=state.survey;
  let pick=ROUTES[0];
  if(s.interests.includes('กิจกรรมทางน้ำ')) pick=ROUTES.find(r=>r.id==='r4');
  else if(s.interests.includes('ศิลปะ')||s.interests.includes('งานฝีมือ')) pick=ROUTES.find(r=>r.id==='r2');
  else if(s.interests.includes('ประวัติศาสตร์')||s.walkAbility!=='เดินได้ตามปกติ') pick=ROUTES.find(r=>r.id==='r3');
  else pick=ROUTES.find(r=>r.id==='r1');
  state.selectedRoute=pick;
  state.ai.step='output'; state.ai.reroute=0; state.ai.chosen=null;
  state.survey.done=true;
  state.tab='assistant'; state.extra=null;
  render();
}

    ['➕ เพิ่มจำนวนที่รับได้','เพิ่มจำนวนที่รับได้แล้ว (จำลอง)'],
    ['✅ ยืนยันการจอง','ยืนยันการจองแล้ว (จำลอง)'],
    ['✖️ ปฏิเสธการจอง','ปฏิเสธการจองแล้ว (จำลอง)'],
    ['⚠️ แจ้งคิวเต็ม','แจ้งคิวเต็มแล้ว (จำลอง)'],
    ['🚫 แจ้งกิจกรรมยกเลิก','แจ้งกิจกรรมยกเลิกแล้ว (จำลอง)'],
    ['💵 ปรับราคา','ปรับราคาแล้ว (จำลอง)'],
    ['🍽️ แจ้งเมนูพร้อมขาย','แจ้งเมนูพร้อมขายแล้ว (จำลอง)'],
    ['📊 ตรวจสอบรายได้','รายได้วันนี้ของร้านคุณ 3,200 บาท รับตรงเข้าบัญชี ไม่ผ่านระบบ (จำลอง)']
  ];
  const grid=el(`<div class="action-grid"></div>`);
  actions.forEach(a=>grid.appendChild(el(`<button onclick="alert('${a[1]}')">${a[0]}</button>`)));
  wrap.appendChild(grid);
  return wrap;
}

/* ---------------- VENDOR REGISTRATION ---------------- */
const VENDOR_CATEGORIES=['สถานที่ท่องเที่ยว / แกลเลอรี','ร้านอาหาร','บริการเรือ','รถรับส่งชุมชน','ผู้จัดกิจกรรม / Workshop','วัด / สถานที่ทางศาสนา','อื่นๆ'];
function setVendorField(k,v){ state.vendorForm[k]=v; render(); }
function renderVendorRegister(){
  const f=state.vendorForm;
  const wrap=el(`<div></div>`);
  wrap.appendChild(el(`<div class="back-row"><button onclick="backFromExtra()">←</button><h2>ลงทะเบียนผู้ประกอบการ</h2></div>`));

  if(f.submitted){
    wrap.appendChild(el(`
      <div class="section" style="text-align:center; padding-top:20px;">
        <div style="font-size:34px;">📨</div>
        <h2 style="font-size:16px; margin-top:8px;">ส่งคำขอลงทะเบียนแล้ว</h2>
        <p class="lede">ทีมงานชุมชนจะตรวจสอบข้อมูลและติดต่อกลับภายใน 2–3 วันทำการ เมื่ออนุมัติแล้ว ร้านของคุณจะรับเงินโดยตรงจากนักท่องเที่ยวผ่านช่องทางที่แจ้งไว้</p>
      </div>
    `));
    wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" onclick="backFromExtra()">กลับหน้าแดชบอร์ด</button></div>`));
    return wrap;
  }

  wrap.appendChild(el(`<div class="section" style="padding-top:4px;"><p class="lede">กรอกข้อมูลกิจการของคุณ เพื่อเข้าร่วมเป็นผู้ให้บริการในระบบ เงินทุกบาทที่นักท่องเที่ยวจ่ายจะเข้าช่องทางรับเงินของคุณโดยตรง ระบบไม่หักหรือถือเงินแทน</p></div>`));
  wrap.appendChild(el(`<div class="field" style="margin-top:6px;"><label>ชื่อร้าน/กิจการ</label><input placeholder="เช่น บ้านศิลปิน" oninput="setVendorField('name', this.value)"></div>`));
  wrap.appendChild(el(`
    <div class="field"><label>ประเภทกิจการ</label><div class="chip-select">
      ${VENDOR_CATEGORIES.map(c=>`<div class="chip-opt ${f.category===c?'sel':''}" onclick="setVendorField('category','${c}')">${c}</div>`).join('')}
    </div></div>
  `));
  wrap.appendChild(el(`<div class="field"><label>ชื่อผู้ติดต่อ</label><input placeholder="ชื่อ-นามสกุล" oninput="setVendorField('contact', this.value)"></div>`));
  wrap.appendChild(el(`<div class="field"><label>เบอร์โทรศัพท์</label><input placeholder="08X-XXX-XXXX" oninput="setVendorField('phone', this.value)"></div>`));
  wrap.appendChild(el(`<div class="field"><label>ที่ตั้งกิจการ</label><input placeholder="เช่น ริมคลองบางหลวง ใกล้วัดกำแพง" oninput="setVendorField('location', this.value)"></div>`));
  wrap.appendChild(el(`
    <div class="field"><label>ช่องทางรับเงินโดยตรงจากนักท่องเที่ยว</label><div class="chip-select">
      ${['พร้อมเพย์','บัญชีธนาคาร','เงินสดหน้างาน'].map(t=>`<div class="chip-opt ${f.payType===t?'sel':''}" onclick="setVendorField('payType','${t}')">${t}</div>`).join('')}
    </div></div>
  `));
  wrap.appendChild(el(`<div class="field"><label>หมายเลขพร้อมเพย์ / เลขบัญชี (ถ้ามี)</label><input placeholder="เช่น 08X-XXX-XXXX" oninput="setVendorField('payDetail', this.value)"></div>`));
  wrap.appendChild(el(`<div class="field"><label>รายละเอียดกิจการ/บริการ</label><textarea oninput="setVendorField('desc', this.value)"></textarea></div>`));
  wrap.appendChild(el(`<div class="field-note" style="margin:0 18px 6px;">เว็บนี้ทำหน้าที่เป็นตัวกลางด้านข้อมูล การจัดคิว และการจัดการเส้นทางเท่านั้น การชำระเงินทั้งหมดเกิดขึ้นโดยตรงระหว่างนักท่องเที่ยวกับผู้ประกอบการ</div>`));
  wrap.appendChild(el(`<div class="section"><button class="btn btn-primary" onclick="submitVendorForm()">ส่งคำขอลงทะเบียน</button></div>`));

  wrap.appendChild(el(`<div class="section" style="padding-top:10px;"><h2 style="font-size:14px;">ผู้ประกอบการที่ลงทะเบียนแล้ว</h2></div>`));
  VENDOR_REGISTRY.forEach(v=>{
    wrap.appendChild(el(`
      <div class="list-row">
        <div><div class="name">${v.name}</div><div class="sub">${v.category}</div></div>
        <span class="badge ${v.status==='อนุมัติแล้ว'?'badge-live':'badge-cached'}">${v.status}</span>
      </div>
    `));
  });
  return wrap;
}
function submitVendorForm(){
  const f=state.vendorForm;
  if(f.name){
    VENDOR_REGISTRY.push({name:f.name, category:f.category, contact:f.contact, phone:f.phone, payType:f.payType, payDetail:f.payDetail, status:'รอตรวจสอบ', open:false});
  }
  state.vendorForm.submitted=true;
  render();
}

/* ---------------- live mock updates ---------------- */
setInterval(()=>{
  state.live.people += Math.floor(Math.random()*5)-2;
  if(state.live.people<80) state.live.people=80;
  state.live.boatMin = Math.max(1, state.live.boatMin-1);

applyChrome();
render();
